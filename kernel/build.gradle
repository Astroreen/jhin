// Jhin kernel: the host process that loads plugins and keeps the local state.
// No spring-boot-starter-security and no langchain4j here (MVP rules).
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

version = '0.2.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'com.astroreen:jhin-sdk:0.2.0-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.xerial:sqlite-jdbc:3.50.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

// The Boot BOM manages a newer JUnit line and a different AssertJ than the
// versions pinned above; import the matching JUnit BOM and pin AssertJ so one
// aligned stack wins.
dependencyManagement {
    imports {
        mavenBom 'org.junit:junit-bom:5.11.4'
    }
    dependencies {
        dependency 'org.assertj:assertj-core:3.27.3'
    }
}

springBoot {
    mainClass = 'com.astroreen.jhin.kernel.KernelMain'
}
