// Jhin kernel: the host process that loads plugins and keeps the local state.
// No spring-boot-starter-security and no langchain4j here (MVP rules).
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

version = '0.2.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'com.astroreen:jhin-sdk:0.2.0-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.xerial:sqlite-jdbc:3.50.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

test {
    useJUnitPlatform()
}

// The stack must match the line spring-test 7 is built against (JUnit Jupiter
// 6 and its platform launcher); import the matching JUnit BOM and pin AssertJ
// so one aligned stack wins over Boot's mixed defaults.
dependencyManagement {
    imports {
        mavenBom 'org.junit:junit-bom:6.0.3'
    }
    dependencies {
        dependency 'org.assertj:assertj-core:3.27.7'
    }
}

springBoot {
    mainClass = 'com.astroreen.jhin.kernel.KernelMain'
}
