// Root composite build.
//
// This root build has no sources of its own: it only coordinates the
// included builds (sdk, kernel, plugins/*) declared in settings.gradle and
// assembles the release bundle with `dist` (see below).

// ---------------------------------------------------------------------------
// dist — the release bundle
//
// `./gradlew dist` builds every artifact a user installs and assembles it
// under dist/:
//
//   dist/jhin-kernel-0.2.0.jar   kernel boot jar, renamed for the bundle
//   dist/plugins-default/*.jar   the ten default plugins (never the example
//                                and never the qa-mock-llm harness)
//   dist/run.sh                  restart loop (copied from deploy/run.sh)
//   dist/README.md               install and first-run instructions
//   dist/MANIFEST.txt            size and SHA-256 per artifact
// ---------------------------------------------------------------------------

// The ten default plugins shipped in the bundle. The example plugin and the
// qa-mock-llm QA harness are built with the rest (they must stay compilable)
// but are deliberately never copied: the distribution carries the default
// plugins only.
def defaultPluginBuilds = [
    'jhin-plugin-sessions',
    'jhin-plugin-security',
    'jhin-plugin-llm',
    'jhin-plugin-llm-builtin',
    'jhin-plugin-agent',
    'jhin-plugin-tools-builtin',
    'jhin-plugin-mcp',
    'jhin-plugin-ui-kit',
    'jhin-plugin-ui-default',
    'jhin-plugin-reload',
]
def examplePluginBuild = 'jhin-plugin-example'
def qaMockPluginBuild = 'jhin-plugin-qa-mock-llm'

// Finds the single jar a plugin build produced, ignoring the classifier jars
// Gradle may also write into build/libs (-plain, -sources, -javadoc).
def findModuleJar = { File libsDir ->
    def jars = libsDir.listFiles()?.findAll { f ->
        f.isFile() && f.name.endsWith('.jar') &&
            !f.name.contains('-plain') &&
            !f.name.contains('-sources') &&
            !f.name.contains('-javadoc')
    } ?: []
    if (jars.size() != 1) {
        throw new GradleException(
            "expected exactly one jar in ${libsDir}, found: ${jars*.name}")
    }
    jars[0]
}

tasks.register('dist') {
    group = 'build'
    description = 'Assembles the release bundle under dist/ (kernel, default plugins).'

    // Backend artifacts: the SDK is published first so the included builds
    // resolve it from mavenLocal when they are built standalone, then the
    // kernel boot jar and every plugin jar (the example and the qa-mock-llm
    // harness included — both are built, never shipped).
    dependsOn gradle.includedBuild('sdk').task(':publishToMavenLocal')
    dependsOn gradle.includedBuild('kernel').task(':bootJar')
    (defaultPluginBuilds + [examplePluginBuild, qaMockPluginBuild]).each { name ->
        dependsOn gradle.includedBuild(name).task(':jar')
    }

    doLast {
        def distDir = file('dist')

        // Fresh tree every run: a stale artifact must never leak into a release.
        if (distDir.exists()) {
            distDir.deleteDir()
        }
        new File(distDir, 'plugins-default').mkdirs()

        // --- kernel boot jar, renamed for the bundle --------------------
        def kernelJar = findModuleJar(file('kernel/build/libs'))
        def kernelVersion = kernelJar.name
            .replaceFirst(/^kernel-/, '')
            .replaceFirst(/\.jar$/, '')
            .replaceFirst(/-SNAPSHOT$/, '')
        def kernelDest = new File(distDir, "jhin-kernel-${kernelVersion}.jar")
        java.nio.file.Files.copy(kernelJar.toPath(), kernelDest.toPath())

        // --- default plugin jars (never the example or qa-mock-llm) -----
        def shippedPlugins = []
        defaultPluginBuilds.each { name ->
            def shortName = name - 'jhin-plugin-'
            def jar = findModuleJar(file("plugins/${shortName}/build/libs"))
            def dest = new File(distDir, "plugins-default/${jar.name}")
            java.nio.file.Files.copy(jar.toPath(), dest.toPath())
            shippedPlugins << dest.name
        }

        // --- restart loop and generated README --------------------------
        def runSh = new File(distDir, 'run.sh')
        java.nio.file.Files.copy(file('deploy/run.sh').toPath(), runSh.toPath())
        runSh.setExecutable(true)

        // --- hard guards ------------------------------------------------
        // The bundle must carry the kernel jar, the default plugin jars and
        // run.sh — and neither the example plugin nor the qa-mock-llm QA
        // harness may appear anywhere inside it.
        def missing = []
        if (!kernelDest.isFile()) {
            missing << kernelDest.name
        }
        shippedPlugins.each { name ->
            if (!new File(distDir, "plugins-default/${name}").isFile()) {
                missing << "plugins-default/${name}"
            }
        }
        if (!runSh.isFile()) {
            missing << 'run.sh'
        }
        if (!missing.isEmpty()) {
            throw new GradleException("dist: bundle is incomplete, missing: ${missing}")
        }
        def offenders = []
        distDir.eachFileRecurse { f ->
            def rel = distDir.toPath().relativize(f.toPath()).toString()
            if (rel.contains('example') || rel.contains('qa-mock')) {
                offenders << rel
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                "dist: the example and qa-mock-llm plugins must not ship, found: ${offenders}")
        }

        // --- README.md (generated) --------------------------------------
        def readme = """\
# Jhin — release bundle

This directory is a self-contained Jhin release: the host process and the
default plugins. Copy it anywhere; the only requirement for the host is a
Java 21 runtime.

## Layout

    jhin-kernel-${kernelVersion}.jar   the host process
    plugins-default/        default plugin jars, seeded into the home on start
    run.sh                  restart loop around the kernel jar
    MANIFEST.txt            size and SHA-256 per artifact

## Install and first run

1. Copy this directory somewhere permanent, for example to /opt/jhin.
2. Start the host:

       ./run.sh

   The script runs the kernel jar in a restart loop (exit code 0 means
   "restart requested", for example after POST /admin/reload; any other exit
   is restarted the same way). `java -jar ${kernelDest.name}` runs the host
   once, without the loop. Extra arguments (for example --server.port=8443)
   are passed to the kernel.
3. The data directory is JHIN_HOME (default ~/.jhin): data/jhin.db, plugins/,
   keystore/, logs/. On first start the jars in plugins-default/ are seeded
   into \$JHIN_HOME/plugins/ — a copy you modified yourself is never
   overwritten — and the listener comes up on https://0.0.0.0:8443. With the
   security plugin loaded a self-signed certificate is generated into
   keystore/ and its SHA-256 fingerprint is logged for pinning.
4. Open https://host:8443/ in a browser: the host serves the web client
   itself. The client probes GET /_jhin/health, fetches
   GET /_jhin/bootstrap and renders what the server sent.

## Web client

- Browser: https://host:8443/ (served by the host)

## Empty by default

A fresh install shows no product UI until plugins are installed: a bare
kernel serves exactly GET /_jhin/health and GET /_jhin/bootstrap (empty:
true). The plugin jars in plugins-default/ carry the product; delete any jar
to remove its feature and restart (or POST /admin/reload) to apply.

More documentation — architecture, plugin development, the server-driven UI —
ships with the source tree under docs/.
"""
        new File(distDir, 'README.md').text = readme

        // --- MANIFEST.txt: size and SHA-256 per artifact ----------------
        def sha256 = { File f ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int read
                while ((read = input.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString()
        }
        def manifestLines = []
        distDir.eachFileRecurse { f ->
            if (f.isFile() && f.name != 'MANIFEST.txt') {
                manifestLines << [distDir.toPath().relativize(f.toPath()).toString(), f]
            }
        }
        manifestLines.sort { it[0] }
        def manifest = new StringBuilder()
        manifest.append('# Jhin release bundle manifest (generated by ./gradlew dist)\n')
        manifest.append('# <sha256>  <size-in-bytes>  <path-relative-to-dist>\n')
        manifestLines.each { rel, f ->
            manifest.append("${sha256(f)}  ${f.length()}  ${rel}\n")
        }
        new File(distDir, 'MANIFEST.txt').text = manifest.toString()

        // --- summary ----------------------------------------------------
        logger.lifecycle('dist: assembled dist/')
        manifestLines.each { rel, f -> logger.lifecycle("dist:   ${rel} (${f.length()} bytes)") }
        logger.lifecycle('dist: manifest:')
        manifest.toString().split('\n').each { logger.lifecycle("dist:   ${it}") }
    }
}

// Delegate `clean` to every included build so `./gradlew clean` cleans everything.
tasks.register('clean') {
    group = 'build'
    description = 'Cleans all included builds.'
    dependsOn gradle.includedBuilds*.task(':clean')
}

// Delegate `test` to every included build so `./gradlew test` runs the whole
// composite test suite (mirrors `build` below).
tasks.register('test') {
    group = 'verification'
    description = 'Runs the tests of every included build.'
    dependsOn gradle.includedBuilds*.task(':test')
}

// Delegate `build` to every included build so `./gradlew build` builds everything.
// Without this the bare `build` selector does not reach included builds (and
// even collides with the built-in `buildEnvironment` task name abbreviation).
tasks.register('build') {
    group = 'build'
    description = 'Builds all included builds.'
    dependsOn gradle.includedBuilds*.task(':build')
}
