packages:
  - packages/*
  - plugins/*
  - apps/*
  - e2e

catalog:
  "@playwright/test": 1.61.1
  "@types/node": 24.19.2
  "@types/semver": 7.8.0
  "@types/ws": 8.18.2
  "@vitest/browser-playwright": 5.0.5
  jsonc-parser: 3.3.1
  knip: 6.41.0
  pino: 10.4.0
  playwright: 1.61.1
  semver: 7.8.5
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  ws: 8.22.0
  zod: 4.6.7

# Vite+ ships its own Vite core; route every `vite` request to it so the
# toolchain has a single Vite and test-runner instance.
overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
