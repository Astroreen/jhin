catalog:
  "@anthropic-ai/claude-agent-sdk": 0.3.302
  "@anthropic-ai/sdk": 0.134.0
  "@base-ui/react": 1.9.0
  "@modelcontextprotocol/sdk": 1.32.1
  "@playwright/test": 1.61.1
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/semver": 7.8.0
  "@types/ws": 8.18.2
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser-playwright": 5.0.5
  class-variance-authority: 0.7.1
  jsonc-parser: 3.3.1
  knip: 6.41.0
  lucide-react: 1.59.0
  oxc-transform-react: 0.152.0
  pino: 10.4.0
  playwright: 1.61.1
  react: 19.3.1
  react-dom: 19.3.1
  react-markdown: 10.1.0
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  semver: 7.8.5
  shiki: 4.5.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  ws: 8.22.0
  zod: 4.6.7

# Vite+ ships its own Vite core; route every `vite` request to it so the
# toolchain has a single Vite and test-runner instance.
overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
