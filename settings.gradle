rootProject.name = 'jhin'

// Standalone builds shared across all plugin modules (see T4).
includeBuild 'sdk'
includeBuild 'kernel'

// Twelve plugin builds, each publishing its own jar (see T4 module skeletons).
// Build names are prefixed so task addressing reads :jhin-plugin-<name>:<task>.
includeBuild('plugins/sessions') { name = 'jhin-plugin-sessions' }
includeBuild('plugins/security') { name = 'jhin-plugin-security' }
includeBuild('plugins/llm') { name = 'jhin-plugin-llm' }
includeBuild('plugins/llm-builtin') { name = 'jhin-plugin-llm-builtin' }
includeBuild('plugins/agent') { name = 'jhin-plugin-agent' }
includeBuild('plugins/tools-builtin') { name = 'jhin-plugin-tools-builtin' }
includeBuild('plugins/mcp') { name = 'jhin-plugin-mcp' }
includeBuild('plugins/ui-kit') { name = 'jhin-plugin-ui-kit' }
includeBuild('plugins/ui-default') { name = 'jhin-plugin-ui-default' }
includeBuild('plugins/reload') { name = 'jhin-plugin-reload' }
includeBuild('plugins/example') { name = 'jhin-plugin-example' }
includeBuild('plugins/qa-mock-llm') { name = 'jhin-plugin-qa-mock-llm' }
