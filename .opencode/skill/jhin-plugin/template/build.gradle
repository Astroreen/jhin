// Jhin plugin module: __PLUGIN_NAME__ (__PLUGIN_ID__).
apply from: "${rootDir}/../../gradle/plugin-conventions.gradle"

group = 'com.astroreen'
version = '0.2.0'

dependencies {
    // Tests need the JUnit platform launcher at runtime (Gradle 9 does not
    // pull it in). Keep test-only dependencies out of the plugin jar.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
