// Jhin plugin module: agent (scaffolded in T4, logic lands in later tasks).
apply from: "${rootDir}/../../gradle/plugin-conventions.gradle"

group = 'com.astroreen'
version = '0.2.0'

base {
    archivesName = 'jhin-plugin-agent'
}

dependencies {
    // The kernel's real PluginClassLoader under test (AgentExportsTest drives
    // the production export-scoped loading): composite substitution of the
    // included kernel build. kernel/build.gradle gained a group line so the
    // coordinates com.astroreen:kernel:0.2.0-SNAPSHOT resolve to that build.
    // transitive = false: kernel's own dependencies carry no versions of
    // their own (the Spring Boot dependency-management plugin pins them only
    // inside the kernel build) and the test needs none of them —
    // PluginClassLoader only touches the JDK and slf4j, which arrives through
    // jhin-sdk.
    testImplementation('com.astroreen:kernel:0.2.0-SNAPSHOT') { transitive = false }

    // Test-only: unit tests need the JUnit platform launcher at runtime.
    // Stays out of the plugin jar (testRuntimeOnly is not part of
    // runtimeClasspath).
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
