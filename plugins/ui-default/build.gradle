// Jhin plugin module: ui-default (the default SDUI plugin: bootstrap, screen,
// action and stream endpoints).
apply from: "${rootDir}/../../gradle/plugin-conventions.gradle"

group = 'com.astroreen'
version = '0.2.0'

base {
    archivesName = 'jhin-plugin-ui-default'
}

dependencies {
    // Compiled against the UI building blocks of jhin.ui-kit, the session
    // API of jhin.sessions and the exported API of the optional integrations
    // jhin.security, jhin.llm and jhin.agent, all resolved at runtime through
    // their manifest exports (plugin-to-plugin class sharing). compileOnly
    // keeps every jar out of this plugin's archive; the coordinates resolve
    // through composite build substitution of the included plugin builds.
    compileOnly 'com.astroreen:jhin-plugin-ui-kit:0.2.0'
    compileOnly 'com.astroreen:jhin-plugin-sessions:0.2.0'
    compileOnly 'com.astroreen:jhin-plugin-security:0.2.0'
    compileOnly 'com.astroreen:jhin-plugin-llm:0.2.0'
    compileOnly 'com.astroreen:jhin-plugin-agent:0.2.0'

    // Tests drive the real ui-kit builder and the real sessions plugin against
    // a SQLite-backed harness, so both modules are on the test classpath; the
    // optional API jars are there so the tests can build the typed handlers
    // and screens against fakes.
    testImplementation 'com.astroreen:jhin-plugin-ui-kit:0.2.0'
    testImplementation 'com.astroreen:jhin-plugin-sessions:0.2.0'
    testImplementation 'com.astroreen:jhin-plugin-security:0.2.0'
    testImplementation 'com.astroreen:jhin-plugin-llm:0.2.0'
    testImplementation 'com.astroreen:jhin-plugin-agent:0.2.0'
    // Explicit LangChain4j coordinates for the test fakes: the classes above
    // only arrive packaged into the fat jhin-plugin-llm project jar, and the
    // JDT Gradle build server does not expose classes that come from a
    // project artifact alone. testCompileOnly keeps them unbundled.
    testCompileOnly platform('dev.langchain4j:langchain4j-bom:1.20.1')
    testCompileOnly 'dev.langchain4j:langchain4j-core'
    testImplementation 'org.xerial:sqlite-jdbc:3.50.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

// The documented gallery regen path (HtmlConformanceTest): forward the
// -Djhin.gallery.regen switch into the test JVM so the fixtures regenerate
// deliberately and never by accident.
test {
    systemProperty 'jhin.gallery.regen', System.getProperty('jhin.gallery.regen', 'false')
}
