// Compiles the extracted documentation snippets against the SDK and the agent
// SPI. The sources come from extract_snippets.py; override the source directory
// with the JHIN_SNIPPETS_DIR environment variable (used by the failure QA to
// compile a mutated copy of the docs).
plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly 'com.astroreen:jhin-sdk:0.2.0-SNAPSHOT'
    compileOnly 'com.astroreen:jhin-plugin-agent:0.2.0'
}

def snippetsDir = System.getenv('JHIN_SNIPPETS_DIR') ?: 'build/extracted'

sourceSets {
    main {
        java {
            srcDir snippetsDir
        }
    }
}
