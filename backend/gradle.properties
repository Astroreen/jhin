# NixOS's ambient/default `java` on PATH resolves to a JDK newer than 21 in this environment,
# which does not satisfy this project's `languageVersion = JavaLanguageVersion.of(21)` toolchain
# request, and there is no network access here for Gradle's toolchain auto-provisioning.
# We pin Gradle's toolchain discovery at an actual JDK 21 install already present in the local
# Nix store (matches devenv.nix's pkgs.openjdk21) so compileJava/compileTestJava/bootJar/bootRun
# resolve a JDK 21 compiler+runtime without any download. The Gradle daemon itself keeps running
# on the ambient JDK; only the toolchain used for this project's Java tasks is pinned to 21.
org.gradle.java.installations.paths=/nix/store/dmi8yawhakslys9phr34yc3kd23md572-openjdk-21.0.12+8

# Also works around a separate NixOS-only bug: this JDK reports a 4-component java.version
# (JEP 223 FEATURE.INTERIM.UPDATE.PATCH) that crashes Gradle's embedded Kotlin DSL script
# compiler (org.jetbrains.kotlin...JavaVersion.parse only accepts up to 3 components).
org.gradle.jvmargs=-Djava.version=21.0.5
