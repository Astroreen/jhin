# Derived from T3 Code (MIT, see THIRD_PARTY_NOTICES.md): .github/workflows/release.yml
# and release-desktop.yml, reduced to the desktop app (docs/plans/desktop.md, D925).
#
# Builds the desktop app on Linux, macOS and Windows and publishes the
# installers with electron-updater's feed files to this repository's releases,
# which is where the app looks for updates (D519):
#   - a pushed tag v1.2.3, or "stable", publishes the stable release of
#     apps/desktop/package.json's version (`latest*.yml`) from a commit on main;
#   - "nightly" publishes the prerelease v<version>-nightly.<date>.<run> (`nightly*.yml`);
#   - "dry-run" (the default, and every pull request that changes packaging)
#     builds without a feed and publishes nothing.
# Each platform signs only when all its secrets are set (scripts/desktop-release.ts,
# SIGNING_SECRETS). A stable release fails on macOS and Windows without them,
# unless "allow_unsigned" is chosen: an unsigned macOS app cannot update itself.
# Pull requests never see the signing secrets. A failed run is finished with
# "Re-run failed jobs": a re-run uploads into the release its first attempt
# created, while a new run fails on a version that is already released.

name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/release-desktop.yml
      - scripts/desktop-release.ts
      - scripts/package-desktop.ts
      - apps/desktop/package.json
      - apps/desktop/resources/**
  workflow_dispatch:
    inputs:
      channel:
        description: "What to publish"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - nightly
          - stable
      allow_unsigned:
        description: "Publish a stable release without macOS and Windows signing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history: a stable release must come from a commit on main.
          fetch-depth: 0
          filter: blob:none
      # Node 24 runs the TypeScript helpers as they are.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - id: meta
        name: Resolve the version
        env:
          CHANNEL: ${{ github.event_name == 'push' && 'stable' || inputs.channel || 'dry-run' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "stable" ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "A stable release must be built from a commit on main; $GITHUB_SHA is not." >&2
            exit 1
          fi
          node --input-type=module -e '
            import * as Fs from "node:fs";
            import { nightlyVersion, releaseVersion, updateChannel } from "./scripts/desktop-release.ts";
            const { CHANNEL, RUN_NUMBER, GITHUB_REF_NAME, GITHUB_EVENT_NAME, GITHUB_OUTPUT } = process.env;
            const base = releaseVersion(JSON.parse(Fs.readFileSync("apps/desktop/package.json", "utf8")).version);
            // A tag must name the version the app reports.
            if (GITHUB_EVENT_NAME === "push" && releaseVersion(GITHUB_REF_NAME) !== base) {
              throw new Error(`Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json (${base})`);
            }
            const version = CHANNEL === "nightly" ? nightlyVersion(base, new Date(), Number(RUN_NUMBER)) : base;
            const prerelease = CHANNEL === "nightly";
            Fs.appendFileSync(GITHUB_OUTPUT, `version=${version}\nchannel=${CHANNEL}\nprerelease=${prerelease}\n`);
            console.log(`${CHANNEL} ${version} (${updateChannel(version)} feed files)`);
          '

  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: windows-latest, platform: win, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REPOSITORY: ${{ needs.meta.outputs.channel != 'dry-run' && github.repository || '' }}
          REQUIRE_SIGNING: ${{ needs.meta.outputs.channel == 'stable' && !inputs.allow_unsigned }}
          # macOS: a Developer ID Application certificate and an App Store Connect API key.
          CSC_LINK: ${{ github.event_name != 'pull_request' && matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_TEXT: ${{ github.event_name != 'pull_request' && matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name != 'pull_request' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name != 'pull_request' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          # Windows: Azure Trusted Signing.
          AZURE_TENANT_ID: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ github.event_name != 'pull_request' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
        run: |
          set -euo pipefail
          # electron-builder's notarization reads the API key from a file.
          if [[ -n "$APPLE_API_KEY_TEXT" ]]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_TEXT" > "$key"
            export APPLE_API_KEY="$key"
          fi
          unset APPLE_API_KEY_TEXT
          args=(--platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "$VERSION")
          if [[ -n "$REPOSITORY" ]]; then args+=(--repository "$REPOSITORY"); fi
          if [[ "$REQUIRE_SIGNING" == "true" ]]; then args+=(--require-signing); fi
          node scripts/package-desktop.ts "${args[@]}"
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/nightly*.yml

  release:
    name: Publish the release
    needs: [meta, build]
    if: needs.meta.outputs.channel != 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run of this run uploads into the release its first attempt
          # created; any other run never replaces a published release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]; then
              echo "Release $TAG already exists; bump apps/desktop/package.json to release again." >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
            exit 0
          fi
          flags=(--repo "$GITHUB_REPOSITORY" --title "Jhin $TAG" --generate-notes --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" "${flags[@]}" release/*
