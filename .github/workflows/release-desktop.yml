# Derived from T3 Code (MIT, see THIRD_PARTY_NOTICES.md): .github/workflows/release.yml
# and release-desktop.yml, reduced to the desktop app (docs/plans/desktop.md, D945).
#
# Builds the desktop app on Linux, macOS and Windows and publishes the
# installers with electron-updater's feed files to this repository's releases,
# which is where the app looks for updates (D519):
#   - a pushed tag v1.2.3, or "stable", publishes the stable release of
#     apps/desktop/package.json's version (`latest*.yml`) from a commit on main;
#   - "nightly" publishes the prerelease v<version>-nightly.<date>.<run> (`nightly*.yml`);
#   - "dry-run" (the default, and every pull request that changes packaging)
#     builds as a release would, feed files included, and publishes nothing.
# Each platform signs only when all its secrets are set (scripts/desktop-release.ts,
# SIGNING_SECRETS). A stable release fails on macOS and Windows without them,
# unless "allow_unsigned" is chosen: an unsigned macOS app cannot update itself.
# Only runs that publish get the signing secrets, and they build from main
# only; a dry run (also from a branch) is unsigned. A failed run is finished
# with "Re-run failed jobs": the release stays a draft marked with the run's id
# until every file is up, so a re-run finishes it, while any other run fails on
# a version that already has a release.

name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/release-desktop.yml
      - scripts/desktop-release.ts
      - scripts/package-desktop.ts
      - scripts/pack.ts
      - scripts/packing.ts
      - scripts/workspace-packages.ts
      - apps/desktop/**
      - apps/jhin/package.json
      - plugins/desktop/package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      channel:
        description: "What to publish"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - nightly
          - stable
      allow_unsigned:
        description: "Publish a stable release without macOS and Windows signing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its older run; a dispatch or tag is
  # never dropped as a pending duplicate (release uniqueness is the tag's).
  group: release-desktop-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history: a stable release must come from a commit on main.
          fetch-depth: 0
          filter: blob:none
      # Node 24 runs the TypeScript helpers as they are.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - id: meta
        name: Resolve the version
        env:
          CHANNEL: ${{ github.event_name == 'push' && 'stable' || inputs.channel || 'dry-run' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Whatever publishes (and so gets the signing secrets) is built from main only.
          if [[ "$CHANNEL" != "dry-run" ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "A $CHANNEL release must be built from a commit on main; $GITHUB_SHA is not." >&2
            exit 1
          fi
          node --input-type=module -e '
            import * as Fs from "node:fs";
            import { nightlyVersion, releaseVersion, updateChannel } from "./scripts/desktop-release.ts";
            const { CHANNEL, RUN_NUMBER, GITHUB_REF_NAME, GITHUB_EVENT_NAME, GITHUB_OUTPUT } = process.env;
            const base = releaseVersion(JSON.parse(Fs.readFileSync("apps/desktop/package.json", "utf8")).version);
            // A tag must name the version the app reports.
            if (GITHUB_EVENT_NAME === "push" && releaseVersion(GITHUB_REF_NAME) !== base) {
              throw new Error(`Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json (${base})`);
            }
            const version = CHANNEL === "nightly" ? nightlyVersion(base, new Date(), Number(RUN_NUMBER)) : base;
            const prerelease = CHANNEL === "nightly";
            Fs.appendFileSync(GITHUB_OUTPUT, `version=${version}\nchannel=${CHANNEL}\nprerelease=${prerelease}\n`);
            console.log(`${CHANNEL} ${version} (${updateChannel(version)} feed files)`);
          '

  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: windows-latest, platform: win, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          # Dry runs too: they write the feed files a release would publish.
          REPOSITORY: ${{ github.repository }}
          REQUIRE_SIGNING: ${{ needs.meta.outputs.channel == 'stable' && !inputs.allow_unsigned }}
          # macOS: a Developer ID Application certificate and an App Store Connect API key.
          CSC_LINK: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_TEXT: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          # Windows: Azure Trusted Signing.
          AZURE_TENANT_ID: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ needs.meta.outputs.channel != 'dry-run' && matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
        run: |
          set -euo pipefail
          # electron-builder's notarization reads the API key from a file.
          if [[ -n "$APPLE_API_KEY_TEXT" ]]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            trap 'rm -f "$key"' EXIT
            printf '%s' "$APPLE_API_KEY_TEXT" > "$key"
            export APPLE_API_KEY="$key"
          fi
          unset APPLE_API_KEY_TEXT
          args=(--platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "$VERSION")
          if [[ -n "$REPOSITORY" ]]; then args+=(--repository "$REPOSITORY"); fi
          if [[ "$REQUIRE_SIGNING" == "true" ]]; then args+=(--require-signing); fi
          node scripts/package-desktop.ts "${args[@]}"
      - name: Check the feed file
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # The feed must name an installer that is uploaded beside it.
          channel=latest
          if [[ "$VERSION" == *-nightly.* ]]; then channel=nightly; fi
          case "${{ matrix.platform }}" in
            linux) feed="$channel-linux.yml" ;;
            mac) feed="$channel-mac.yml" ;;
            win) feed="$channel.yml" ;;
          esac
          feed="apps/desktop/release/$feed"
          test -f "$feed" || { echo "missing $feed" >&2; exit 1; }
          cat "$feed"
          for file in $(sed -n 's/^ *- url: //p' "$feed"); do
            test -f "apps/desktop/release/$file" || { echo "$feed names missing $file" >&2; exit 1; }
          done
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/nightly*.yml

  release:
    name: Publish the release
    needs: [meta, build]
    if: needs.meta.outputs.channel != 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The release is a draft until every file is up, marked with this run's id:
          # a re-run finishes its own draft, and nothing replaces a published release.
          marker="<!-- release-desktop run $GITHUB_RUN_ID -->"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.draft, (.body // \"\" | contains(\"$marker\"))] | @tsv")"
          if [[ -z "$existing" ]]; then
            flags=(--repo "$GITHUB_REPOSITORY" --title "Jhin $TAG" --generate-notes --notes "$marker")
            flags+=(--target "$GITHUB_SHA" --draft)
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease --latest=false); fi
            gh release create "$TAG" "${flags[@]}"
          elif [[ "$existing" != $'true\ttrue' ]]; then
            echo "Release $TAG exists and is not this run's draft; bump apps/desktop/package.json." >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
