name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: vp check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: vp run -r typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Browser-mode tests (*.browser.test.ts) run in headless Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: vp test run

  knip:
    name: Unused code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm knip

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Always: the report holds the screenshots PRs cite as evidence.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  dev-scripts:
    name: Dev scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck scripts/t3/*.sh
      - run: bash scripts/t3/smoke.sh

  pack:
    name: Packed CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Packs jhin-ai and its workspace packages, installs the tarballs outside
      # the workspace and runs the installed CLI from node_modules.
      - run: pnpm pack:smoke

  # Single required status for branch protection.
  ci:
    name: CI
    if: always()
    needs: [check, typecheck, unit, knip, e2e, dev-scripts, pack]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"(failure|cancelled|skipped)"'; then exit 1; fi
