name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: vp check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: vp run -r typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Chromium's system packages take 8–10 minutes on a slow apt mirror when
    # the cache misses them (once per runner image, D1684).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      # Browser-mode tests (*.browser.test.ts) run in headless Chromium.
      - uses: ./.github/actions/chromium
      - run: vp test run

  knip:
    name: Unused code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - run: pnpm knip

  public-ids:
    name: Public ids
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The merge base with main, to compare its public ids with.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
      # On a push to main the merge base is the commit itself: the check passes.
      - run: git fetch --no-tags origin main
      - run: node scripts/public-ids.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # As for unit tests: Chromium's install alone can take 10 minutes on a miss.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      # The desktop app's tests (docs/plans/desktop.md, D523): Electron's binary,
      # which a cached install may not have fetched, and its sandbox, which
      # Ubuntu's AppArmor keeps from unprivileged user namespaces.
      - name: Install Electron
        run: node apps/desktop/node_modules/electron/install.js
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a display on Linux.
      - run: xvfb-run -a pnpm e2e
      # Always: the report holds the screenshots PRs cite as evidence.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  dev-scripts:
    name: Dev scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck scripts/t3/*.sh
      - run: bash scripts/t3/smoke.sh

  pack:
    name: Packed CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
      # Packs jhin-ai and its workspace packages, installs the tarballs outside
      # the workspace and runs the installed CLI from node_modules.
      - run: pnpm pack:smoke

  # Single required status for branch protection.
  ci:
    name: CI
    if: always()
    needs: [check, typecheck, unit, knip, public-ids, e2e, dev-scripts, pack]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"(failure|cancelled|skipped)"'; then exit 1; fi
