name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: vp check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: vp run -r typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Chromium's system packages (--with-deps) take 8–10 minutes on a slow
    # apt mirror, which alone used to eat most of the job's time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Browser-mode tests (*.browser.test.ts) run in headless Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: vp test run

  knip:
    name: Unused code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm knip

  public-ids:
    name: Public ids
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # The merge base with main, to compare its public ids with.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      # On a push to main the merge base is the commit itself: the check passes.
      - run: git fetch --no-tags origin main
      - run: node scripts/public-ids.ts

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # As for unit tests: Chromium's install alone can take 10 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      # The desktop app's tests (docs/plans/desktop.md, D523): Electron's binary,
      # which a cached install may not have fetched, and its sandbox, which
      # Ubuntu's AppArmor keeps from unprivileged user namespaces.
      - name: Install Electron
        run: node apps/desktop/node_modules/electron/install.js
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a display on Linux.
      - run: xvfb-run -a pnpm e2e
      # Always: the report holds the screenshots PRs cite as evidence.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  dev-scripts:
    name: Dev scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck scripts/t3/*.sh
      - run: bash scripts/t3/smoke.sh

  pack:
    name: Packed CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Packs jhin-ai and its workspace packages, installs the tarballs outside
      # the workspace and runs the installed CLI from node_modules.
      - run: pnpm pack:smoke

  # Single required status for branch protection.
  ci:
    name: CI
    if: always()
    needs: [check, typecheck, unit, knip, public-ids, e2e, dev-scripts, pack]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"(failure|cancelled|skipped)"'; then exit 1; fi
