// Jhin SDK: the compile-time contract every plugin builds against.
// Published as com.astroreen:jhin-sdk (the module name drives composite substitution).
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.astroreen'
version = '0.2.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    api 'org.slf4j:slf4j-api:2.0.16'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'jhin-sdk'
        }
    }
}
